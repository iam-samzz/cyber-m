<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile — CyberM</title>
  <link rel="stylesheet" href="css/global_style_about-profile.css" />
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = localStorage.getItem("cyberm-theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile — CyberM</title>
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <div class="site">
    <button
      type="button"
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Switch to dark theme"
      aria-pressed="false"
    >
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6" />
        <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="12" y1="2.5" x2="12" y2="5" />
          <line x1="12" y1="19" x2="12" y2="21.5" />
          <line x1="2.5" y1="12" x2="5" y2="12" />
          <line x1="19" y1="12" x2="21.5" y2="12" />
          <line x1="4.9" y1="4.9" x2="6.6" y2="6.6" />
          <line x1="17.4" y1="17.4" x2="19.1" y2="19.1" />
          <line x1="4.9" y1="19.1" x2="6.6" y2="17.4" />
          <line x1="17.4" y1="6.6" x2="19.1" y2="4.9" />
        </g>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"
          fill="currentColor"
        />
      </svg>
    </button>

    <!-- Shared navbar mounts here once it exists. Left empty for now. -->
    <header id="app-header"></header>

    <main class="profile-page" id="page-profile">
      <div class="container">
        <p class="breadcrumb">WORKSPACE / PROFILE</p>
        <h1 class="page-title">Your profile.</h1>

        <!-- Identity -->
        <section class="card profile-card" aria-label="Profile identity">
          <div class="profile-identity">
            <div class="profile-avatar" id="profile-avatar" aria-hidden="true"></div>
            <div>
              <h2 class="profile-name" id="profile-name"></h2>
              <p class="profile-meta">
                <span id="profile-handle"></span>
                <span class="dot">·</span>
                <span id="profile-tagline"></span>
              </p>
              <p class="profile-bio" id="profile-bio"></p>
            </div>
          </div>
          <button type="button" class="btn btn-primary" id="edit-profile-btn">
            Edit profile
          </button>
        </section>

        <!-- Stats -->
        <section class="stat-grid" id="stat-grid" aria-label="Profile stats"></section>

        <!-- Learning + achievements -->
        <section class="detail-grid">
          <div class="card panel" aria-label="Learning progress">
            <div class="panel-header">
              <h3 class="panel-title">Learning</h3>
              <p class="panel-subtitle" id="learning-subtitle"></p>
            </div>
            <div class="skill-list" id="skill-list"></div>
          </div>

          <div class="card panel" aria-label="Achievements">
            <div class="panel-header">
              <h3 class="panel-title">Achievements</h3>
              <p class="panel-subtitle">Badges earned</p>
            </div>
            <div class="badge-grid" id="badge-grid"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- Edit profile modal -->
    <div class="modal-overlay" id="edit-profile-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
        <div class="modal-header">
          <h2 id="edit-profile-title">Edit profile</h2>
          <button type="button" class="modal-close" id="edit-profile-close" aria-label="Close">&times;</button>
        </div>
        <form class="modal-form" id="edit-profile-form">
          <div class="field">
            <label class="field-label" for="field-name">Name</label>
            <input type="text" id="field-name" required />
          </div>
          <div class="field">
            <label class="field-label" for="field-handle">Handle</label>
            <div class="field-prefix">
              <span>@</span>
              <input type="text" id="field-handle" required />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="field-tagline">Tagline</label>
            <input type="text" id="field-tagline" maxlength="60" />
          </div>
          <div class="field">
            <label class="field-label" for="field-bio">Bio</label>
            <textarea id="field-bio" rows="3" maxlength="200"></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="edit-profile-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/global_about_profile.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
