<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — CyberM</title>
  <link rel="stylesheet" href="css/global_style_about-profile.css" />
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = localStorage.getItem("cyberm-theme");
        var theme =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — CyberM</title>
  <link rel="stylesheet" href="css/about.css" />
</head>
<body>
  <div class="site">
    <button
      type="button"
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Switch to dark theme"
      aria-pressed="false"
    >
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6" />
        <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="12" y1="2.5" x2="12" y2="5" />
          <line x1="12" y1="19" x2="12" y2="21.5" />
          <line x1="2.5" y1="12" x2="5" y2="12" />
          <line x1="19" y1="12" x2="21.5" y2="12" />
          <line x1="4.9" y1="4.9" x2="6.6" y2="6.6" />
          <line x1="17.4" y1="17.4" x2="19.1" y2="19.1" />
          <line x1="4.9" y1="19.1" x2="6.6" y2="17.4" />
          <line x1="17.4" y1="6.6" x2="19.1" y2="4.9" />
        </g>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"
          fill="currentColor"
        />
      </svg>
    </button>

    <!-- Shared navbar mounts here once it exists. Left empty for now. -->
    <header id="app-header"></header>

    <main class="about-page" id="page-about">
      <div class="container">
        <p class="breadcrumb">WORKSPACE / ABOUT</p>
        <h1 class="page-title">About CyberM.</h1>
        <p class="about-lead" id="about-lead"></p>

        <!-- Platform stats -->
        <section class="stat-grid about-section" id="about-stat-grid" aria-label="Platform stats"></section>

        <!-- What you get -->
        <section class="about-section" aria-label="What CyberM offers">
          <div class="about-section-head">
            <h2 class="about-section-title">What you get</h2>
            <p class="about-section-subtitle">Everything stays in one place</p>
          </div>
          <div class="feature-grid" id="feature-grid"></div>
        </section>

        <!-- Who it's for + team -->
        <section class="about-grid">
          <div class="card panel" aria-label="Who CyberM is for">
            <div class="panel-header">
              <h3 class="panel-title">Who it's for</h3>
            </div>
            <div class="badge-grid" id="audience-grid"></div>
          </div>

          
        </section>
      </div>
    </main>
  </div>

  <script src="js/global_about_profile.js"></script>
  <script src="js/about.js"></script>
</body>
</html>
